name: TV apps
on:
  workflow_dispatch:
    inputs:
      amazon_vega:
        description: Build Amazon Vega OS
        type: boolean
        default: true
  push:
    tags: ['tv-v*']
permissions:
  contents: read
jobs:
  transport-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npm run test:tv
      - run: node --test tests/tv-release.test.mjs
      - run: npm run test:platform
      - run: cargo test --locked --manifest-path tv/native-host/Cargo.toml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tv:browser
      - name: Upload TV browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  lg-webos:
    needs: transport-checks
    runs-on: ubuntu-22.04
    env:
      VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global @webos-tools/cli@3.2.6
      - run: npm run package:webos
      - uses: actions/upload-artifact@v4
        with:
          name: vega-lg-webos
          path: dist-tv/webos/*.ipk
          if-no-files-found: error
  amazon-vega:
    if: inputs.amazon_vega == true || startsWith(github.ref, 'refs/tags/tv-v')
    needs: transport-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-amazon-vega
        timeout-minutes: 25
      - run: npm ci --ignore-scripts
      - run: npm run package:amazon-vega
      - name: Upload Amazon build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-build-diagnostics
          path: |
            dist-tv/amazon-vega/app/package.json
            dist-tv/amazon-vega/app/manifest.toml
            dist-tv/amazon-vega/VegaTransport/package.json
            dist-tv/amazon-vega/VegaTransport/kepler/turbo-modules/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: vega-amazon-vega
          path: dist-tv/amazon-vega/app/build/**/*.vpkg
          if-no-files-found: error
  publish:
    needs: [transport-checks, lg-webos, amazon-vega]
    if: ${{ !cancelled() && needs.transport-checks.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-tv.yml
    with:
      run-id: ${{ github.run_id }}
