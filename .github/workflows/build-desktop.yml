name: "Build desktop"

# The published installers are built and signed locally with the updater key
# that never leaves that machine, so CI builds every desktop platform without
# updater artifacts: it proves the bundles still compile and hands back
# installers for testing.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: cinepix-windows-x64
            args: --bundles nsis
            paths: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-latest
            artifact: cinepix-macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          - name: Linux x64
            os: ubuntu-22.04
            artifact: cinepix-linux-x64
            args: --bundles appimage,deb
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf binutils
          # Bundled into the AppImage (bundleMediaFramework) so video plays
          # on systems without these GStreamer plugins.
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      # postinstall already ran these; running them again makes a broken
      # download fail here instead of inside the bundler.
      - name: Bundle native FFmpeg sidecars
        run: node scripts/setup-ffmpeg.mjs

      - name: Bundle libmpv (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/setup-libmpv.mjs
          ls -la src-tauri/lib/libmpv-2.dll src-tauri/lib/libmpv-wrapper.dll src-tauri/resources/windows/vc_redist.exe

      - name: Verify Windows binary architectures
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-binaries.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build bundles
        shell: bash
        run: npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
