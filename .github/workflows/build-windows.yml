name: "Build Windows"

# The published installer is built and signed locally with the updater key that
# never leaves this machine, so CI only has to prove the Windows bundle still
# compiles and hand back an unsigned installer for testing.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      # postinstall already ran these; running them again makes a broken
      # download fail here instead of inside the bundler.
      - name: Bundle native FFmpeg sidecars
        run: node scripts/setup-ffmpeg.mjs

      - name: Bundle libmpv
        shell: bash
        run: |
          node scripts/setup-libmpv.mjs
          ls -la src-tauri/lib/libmpv-2.dll src-tauri/lib/libmpv-wrapper.dll src-tauri/resources/windows/vc_redist.exe

      - name: Verify Windows binary architectures
        run: node scripts/verify-windows-binaries.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build installer
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cinepix-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
