[package]
name = "vega-tv-host"
version = "2.3.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
url = "2"
rand = "0.8"
regex = "1"
futures-util = "0.3"
tokio-util = {version = "0.7", features = ["rt"]}

[profile.release]
lto = true
panic = "abort"
opt-level = "s"
